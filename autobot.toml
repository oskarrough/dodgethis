# Settings for arbe-file-as-issues, arbe-create-threads-from-issues and arbe-autobot.
repo = "oskarrough/dodgethis"
bb = { project = "proj_dhp5r3qujz", machine = "office-linux" }
# Cursor (acp-cursor) without a payment method on file runs only composer-2.5, grok-4.6 and Auto; Opus 5, Fable 5 and GPT-5.6 Sol answer "Add a payment method".
# composer-2.5 as orchestrator skipped the fix and verify threads and did both itself, so the orchestrator runs grok-4.6 too.
orchestrator = "acp-cursor grok-4.6 low"
fix = "acp-cursor grok-4.6 high"
verify = "acp-cursor grok-4.6 high"
max_threads = 3
lookback = "2 hours" # schedule interval plus overlap
