<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Concept art trial · DodgeThis</title>
		<link rel="stylesheet" href="/pages/page.css" />
		<style>
			figure {
				margin: 2rem 0;
			}
			figure img {
				display: block;
				width: 100%;
				height: auto;
			}
			figcaption {
				margin-top: 0.6rem;
			}
		</style>
	</head>
	<body class="page">
		<main>
			<h1>Concept art trial</h1>
			<p class="lede">
				Four directions to judge, not finished game assets. Tap an image to see it full size.
			</p>
			<figure>
				<a href="arena/arena.webp"
					><img src="arena/arena.webp" alt="An Overthrow arena concept" loading="lazy"
				/></a>
				<figcaption>
					<b>The court.</b> A quieter floor against a richer rim and cloud sea.
				</figcaption>
			</figure>
			<figure>
				<a href="ibis/ibis.webp"
					><img src="ibis/ibis.webp" alt="Ibis character concept sheet" loading="lazy"
				/></a>
				<figcaption>
					<b>Ibis.</b> A sharp-beaked hunter with reed arrows and worn feathers.
				</figcaption>
			</figure>
			<figure>
				<a href="kappa/kappa.webp"
					><img src="kappa/kappa.webp" alt="Kappa character concept sheet" loading="lazy"
				/></a>
				<figcaption>
					<b>Kappa.</b> A broad river creature built around a shell and a catching hand.
				</figcaption>
			</figure>
			<figure>
				<a href="lobby/lobby.webp"
					><img src="lobby/lobby.webp" alt="Terrero lobby and mode picker concept" loading="lazy"
				/></a>
				<figcaption>
					<b>The terrero.</b> A paper-card mode picker against the floating wrestling court.
				</figcaption>
			</figure>
		</main>
	</body>
</html>
