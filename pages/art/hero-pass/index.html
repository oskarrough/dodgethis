<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Heroes on the court · DodgeThis</title>
		<link rel="stylesheet" href="/pages/page.css" />
		<style>
			img {
				display: block;
				width: 100%;
				height: auto;
			}
			figure {
				margin: 2rem 0;
			}
		</style>
	</head>
	<body class="page">
		<main>
			<h1>Heroes on the court</h1>
			<p class="lede">
				Six costumes built in the game from painted studies. The studies are directions, not game
				assets; the lineups show the match camera.
			</p>
			<figure>
				<img src="ibis-carambola/proof/lineup.webp" alt="Ibis and Carambola at the match camera" />
				<figcaption>
					Ibis and Carambola: the hunter's beak and arrows, and the stone beak and paddle.
				</figcaption>
			</figure>
			<figure>
				<img src="kappa-lasso/proof/lineup.webp" alt="Kappa and Lasso at the match camera" />
				<figcaption>
					Kappa and Lasso: a keeper's worn shell and a fisherman's open crescent.
				</figcaption>
			</figure>
			<figure>
				<img src="oolong-salvia/proof/lineup.webp" alt="Oolong and Salvia at the match camera" />
				<figcaption>
					Oolong and Salvia: a wrestler's drum and a herb-gatherer's pointed hood.
				</figcaption>
			</figure>
			<h2>The studies</h2>
			<p>Each pair shows the chosen direction first and the alternative second.</p>
			<figure>
				<img src="ibis-carambola/carambola-a/concept.webp" alt="Chosen Carambola study" />
				<figcaption>Carambola A: a triangular stone beak and open paddle.</figcaption>
			</figure>
			<figure>
				<img src="ibis-carambola/carambola-b/concept.webp" alt="Alternative Carambola study" />
				<figcaption>Carambola B: a darker basalt alternative.</figcaption>
			</figure>
			<figure>
				<img src="kappa-lasso/lasso/enamel.webp" alt="Chosen Lasso study" />
				<figcaption>Lasso: pale enamel around an open crescent.</figcaption>
			</figure>
			<figure>
				<img src="kappa-lasso/lasso/hide.webp" alt="Alternative Lasso study" />
				<figcaption>Lasso: a worn hide alternative.</figcaption>
			</figure>
			<figure>
				<img src="oolong-salvia/oolong-b.webp" alt="Chosen Oolong study" />
				<figcaption>Oolong B: a broad drum, heavy arms and an enamel jug.</figcaption>
			</figure>
			<figure>
				<img src="oolong-salvia/oolong-a.webp" alt="Alternative Oolong study" />
				<figcaption>Oolong A: a more shell-like alternative.</figcaption>
			</figure>
			<figure>
				<img src="oolong-salvia/salvia-b.webp" alt="Chosen Salvia study" />
				<figcaption>Salvia B: a pointed hood and a satchel of herbs.</figcaption>
			</figure>
			<figure>
				<img src="oolong-salvia/salvia-a.webp" alt="Alternative Salvia study" />
				<figcaption>Salvia A: a sharper, beaked alternative.</figcaption>
			</figure>
		</main>
	</body>
</html>
