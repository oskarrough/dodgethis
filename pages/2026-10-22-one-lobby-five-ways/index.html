<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>One lobby, five ways</title>
		<link rel="stylesheet" href="/pages/page.css" />
	</head>
	<body class="page">
		<main>
			<h1>One lobby, five ways</h1>
			<p>The map is already chosen. Assemble a party of 1–5, play while you wait, then head in.</p>
			<section aria-labelledby="06-merge">
				<h2 id="06-merge">6. Merge: seats on top, plates on the floor</h2>
				<figure>
					<a href="06-merge.webp"
						><img
							src="06-merge.webp"
							width="1536"
							height="1024"
							alt="Five seat cards above matching stone plates; Ada’s hero picker is open while Oskar and Ada bonk beside a translucent Mender bot and a lit Overthrow portal."
					/></a>
					<figcaption>
						Tap a seat to pick a hero; five matching stone plates assemble the party below.<br />Bonk
						while you wait, then walk through the lit portal into Overthrow.
					</figcaption>
				</figure>
			</section>
			<section aria-labelledby="01-base">
				<h2 id="01-base">1. Base is the lobby</h2>
				<figure>
					<a href="01-base.webp"
						><img
							src="01-base.webp"
							width="1536"
							height="1024"
							alt="Base is the lobby: Land in the chosen map’s own spawn area; a central shrine swaps heroes, and five ground spots assemble the party. The exit stays shut until everyone is ready."
					/></a>
					<figcaption>
						Land in the chosen map’s own spawn area; swap heroes at the glowing shrine.<br />Five
						spawn spots assemble the party, then the closed gate opens when everyone is ready.
					</figcaption>
				</figure>
			</section>
			<section aria-labelledby="02-draft">
				<h2 id="02-draft">2. Draft over the map</h2>
				<figure>
					<a href="02-draft.webp"
						><img
							src="02-draft.webp"
							width="1536"
							height="1024"
							alt="Draft over the map: The chosen map fills the background, with hero cards above five party seats and one GO button. Along the bottom, the little party heroes can run around and bonk."
					/></a>
					<figcaption>
						The chosen map sits behind hero cards, five party seats and one GO button.<br />Along
						the very bottom, the party’s little heroes run around and bonk.
					</figcaption>
				</figure>
			</section>
			<section aria-labelledby="03-booths">
				<h2 id="03-booths">3. Hero booths</h2>
				<figure>
					<a href="03-booths.webp"
						><img
							src="03-booths.webp"
							width="1536"
							height="1024"
							alt="Hero booths: Walk into a hero booth as a plain blob and emerge as that hero; tapping an empty booth adds a bot. Keep playing in the base, then walk through the exit to enter Dungeon."
					/></a>
					<figcaption>
						Walk into a booth as a plain blob and come out as that hero; tap an empty booth to add a
						bot.<br />Keep playing in the base, then walk through the gate into Dungeon.
					</figcaption>
				</figure>
			</section>
			<section aria-labelledby="04-campfire">
				<h2 id="04-campfire">4. Campfire circle</h2>
				<figure>
					<a href="04-campfire.webp"
						><img
							src="04-campfire.webp"
							width="1536"
							height="1024"
							alt="Campfire circle: Five ground spots circle a little campfire; tap a spot to slide in hero cards. A glowing portal at the edge shows Dungeon and becomes available as soon as one spot is filled."
					/></a>
					<figcaption>
						Five spots circle a little campfire; tapping a spot slides in hero cards.<br />The
						portal shows Dungeon and lights up as soon as one spot is filled.
					</figcaption>
				</figure>
			</section>
			<section aria-labelledby="05-menu-over-floor">
				<h2 id="05-menu-over-floor">5. Plain menu over live floor</h2>
				<figure>
					<a href="05-menu-over-floor.webp"
						><img
							src="05-menu-over-floor.webp"
							width="1536"
							height="1024"
							alt="Plain menu over live floor: Five party seats and one GO button float over the chosen map’s live ground. Beneath them the party runs around, so waiting stays playable."
					/></a>
					<figcaption>
						Five party seats and one GO button float over the chosen map’s live ground.<br />Under
						the menu, the party runs around and bonks while everyone gets ready.
					</figcaption>
				</figure>
			</section>
		</main>
	</body>
</html>
