<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Review feed</title>
<style>
	body {
		font: 16px system-ui;
		max-width: 1200px;
		margin: 0 auto;
		padding: 16px;
	}
	img,
	video {
		width: 240px;
		margin: 0 8px 8px 0;
		cursor: zoom-in;
	}
	video {
		width: 480px;
	}
	dialog {
		width: 100vw;
		height: 100vh;
		max-width: none;
		max-height: none;
		margin: 0;
		padding: 0;
		border: 0;
		background: #111e;
		color: #ddd;
	}
	dialog img {
		width: 100%;
		height: calc(100% - 32px);
		object-fit: contain;
		margin: 0;
		cursor: default;
	}
	dialog p {
		margin: 0;
		text-align: center;
		line-height: 32px;
	}
</style>
<h1>Review feed</h1>
<dialog id="viewer">
	<img />
	<p></p>
</dialog>
<div id="feed">No entries yet. Agents add them with <code>bun run review</code>.</div>
<script>
	const isVideo = (f) => /\.(webm|mp4)$/i.test(f)
	fetch('feed.json')
		.then((r) => r.json())
		.then((feed) => {
			document.getElementById('feed').innerHTML = feed
				.map(
					(e) => `<section>
<h2>${e.title}</h2>
<small>${new Date(e.at).toLocaleString()} · ${e.thread}</small>
<p><b>${e.ask}</b></p>
<div>${e.media.map((f) => (isVideo(f) ? `<video src="${f}" controls></video>` : `<img src="${f}" loading="lazy">`)).join('')}</div>
<p>${e.links.map((l) => `<a href="${l}">${l}</a>`).join(' · ')}</p>
</section>`,
				)
				.join('')
		})
		.catch(() => {})
	const viewer = document.getElementById('viewer')
	let index = 0
	const all = () => [...document.querySelectorAll('#feed img')]
	const show = (i) => {
		const imgs = all()
		index = (i + imgs.length) % imgs.length
		viewer.querySelector('img').src = imgs[index].src
		const title = imgs[index].closest('section').querySelector('h2').textContent
		viewer.querySelector('p').textContent =
			`${index + 1} / ${imgs.length} · ${title} · ← → to browse, Esc to close`
	}
	document.addEventListener('click', (e) => {
		if (e.target.closest('#feed') && e.target.tagName === 'IMG') {
			show(all().indexOf(e.target))
			viewer.showModal()
		} else if (e.target.closest('dialog')) viewer.close()
	})
	document.addEventListener('keydown', (e) => {
		if (!viewer.open) return
		if (e.key === 'ArrowRight') show(index + 1)
		if (e.key === 'ArrowLeft') show(index - 1)
	})
</script>
