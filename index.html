<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barriecito&family=Darumadrop+One&family=Ranchers&display=swap"
			rel="stylesheet"
		/>
		<title>dodgethis</title>
		<style>
			:root {
				color-scheme: light;
				--ui-font: 'Darumadrop One', 'Ranchers', 'Barriecito', system-ui, sans-serif;
				--page-bg: #8fd7ff;
				--court-bg: #69d66f;
				--court-line: #fff7c7;
				--court-rim: #ffd35d;
				--ui-cream: #fffdf4;
				--ui-text: #26445f;
				--ui-muted: #5f7897;
				--ui-panel: rgba(255, 249, 213, 0.9);
				--ui-panel-border: #ffbf3f;
				--ui-button: #ffcf5a;
				--ui-button-hover: #ffe27a;
				--ui-blue: #1677ff;
				--ui-red: #ff4f6d;
				--ui-green: #1b9f5a;
				--ui-gold: #ff9f1c;

				/* Font sizes. Darumadrop reads small, so we run large — base 20px.
				   Everything points at the base for now; tune each token individually. */
				--fs-base: 20px;
				--fs-hud: var(--fs-base);
				--fs-combat: 16px;
				--fs-score: var(--fs-base);
				--fs-title: var(--fs-base);
				--fs-sub: var(--fs-base);
				--fs-button: var(--fs-base);
				--fs-slot: var(--fs-base);
				--fs-name: var(--fs-base);
				--fs-key: var(--fs-base);
				--fs-charge: var(--fs-base);
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: var(--page-bg);
				font-family: var(--ui-font);
				font-size: var(--fs-base);
			}
			/* lil-gui auto-places with a 15px right gap — flush it to the edge. */
			.lil-gui.autoPlace {
				right: 0;
			}
			.app {
				width: 100vw;
				height: 100vh;
				display: block;
				background: var(--page-bg);
			}
			/* Left-stack developer chrome — system face so it never reads as match UI. */
			.hud {
				position: fixed;
				top: 10px;
				left: 10px;
				z-index: 2;
				font:
					12px/1.35 system-ui,
					sans-serif;
				color: rgba(38, 68, 95, 0.55);
				pointer-events: none;
				white-space: pre;
				letter-spacing: 0;
				max-width: min(42ch, 36vw);
			}
			.combat {
				position: fixed;
				bottom: 12px;
				left: 12px;
				width: 360px;
				max-height: 38vh;
				overflow: hidden;
				font:
					var(--fs-combat)/1.5 system-ui,
					sans-serif;
				color: var(--ui-text);
				pointer-events: none;
				display: flex;
				flex-direction: column;
				gap: 1px;
			}
			.combat .row {
				opacity: 0.55;
			}
			.combat .row:last-child {
				opacity: 1;
				color: var(--ui-text);
			}
			.combat .hit {
				color: var(--ui-red);
			}
			.combat .win {
				color: var(--ui-gold);
				font-weight: bold;
			}
			.combat .pickup {
				color: var(--ui-green);
			}

			/* Match chrome — a printed scoreboard sticker. Two kinds of mark, and
			   they must not be confused: a round pip is a round WON (best-of, so
			   the pip count implies the format), a capsule is a unit still
			   STANDING. Both are CSS shapes, never glyphs — the display font
			   substitutes odd fallbacks for ● and ○. */
			.score {
				position: fixed;
				top: 14px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 3;
				display: flex;
				gap: 18px;
				align-items: center;
				padding: 7px 18px 9px;
				font: var(--fs-score)/1 var(--ui-font);
				color: var(--ui-text);
				letter-spacing: 0.14em;
				pointer-events: none;
				text-transform: uppercase;
				background-color: var(--ui-cream);
				/* A printed halftone, echoing the one the renderer puts on the
				   world. Kept faint so it never competes with the numbers. */
				background-image: radial-gradient(
					color-mix(in srgb, var(--ui-text) 22%, transparent) 0.5px,
					transparent 0.6px
				);
				background-size: 4px 4px;
				border: 3px solid var(--ui-text);
				border-radius: 999px;
				box-shadow: 3px 3px 0 var(--ui-text);
			}
			.score[hidden] {
				display: none;
			}
			.score .side {
				display: inline-flex;
				align-items: center;
				gap: 0.5em;
			}
			.score .a {
				color: var(--ui-blue);
			}
			.score .b {
				color: var(--ui-red);
			}
			.score .pips,
			.score .crew {
				display: inline-flex;
				gap: 0.22em;
				align-items: center;
				letter-spacing: 0;
			}
			.score .pip {
				display: inline-block;
				width: 0.5em;
				height: 0.5em;
				border: 2px solid currentColor;
				border-radius: 50%;
				box-sizing: border-box;
				vertical-align: middle;
			}
			.score .pip.on {
				background: currentColor;
			}
			/* A standing unit, shaped like the capsule it represents. Hollow once
			   that unit is out, so the mark stays and only its state changes. */
			.score .unit {
				display: inline-block;
				width: 0.3em;
				height: 0.62em;
				border: 2px solid currentColor;
				border-radius: 999px;
				box-sizing: border-box;
				opacity: 0.45;
			}
			.score .unit.up {
				background: currentColor;
				opacity: 1;
			}
			/* Big rosters collapse to one mark plus a count — 20 capsules is not a
			   number anyone reads, and it would not fit. */
			.score .count {
				font-size: 0.82em;
				letter-spacing: 0.04em;
			}
			.score .mid {
				color: var(--ui-text);
				letter-spacing: 0.08em;
				font-size: 0.72em;
				opacity: 0.72;
			}

			.hit-confirmation {
				position: fixed;
				top: 72px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 4;
				pointer-events: none;
				font: 28px/1 var(--ui-font);
				color: var(--ui-text);
				-webkit-text-stroke: 5px #fffdf4;
				paint-order: stroke fill;
			}

			/* Modal overlay for round-over / match-over.
			   Round-over (.clear) keeps the court + scoreboard readable — no frost. */
			.overlay {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: grid;
				place-items: center;
				background: rgba(143, 215, 255, 0.42);
				backdrop-filter: blur(2px);
			}
			.overlay.clear {
				background: transparent;
				backdrop-filter: none;
			}
			.overlay[hidden] {
				display: none;
			}
			.overlay .card {
				text-align: center;
				color: var(--ui-text);
				font: var(--fs-base)/1.6 var(--ui-font);
				max-width: 60ch;
				padding: 28px 44px;
				background: var(--ui-panel);
				border: 3px solid var(--ui-text);
				border-radius: 24px;
				box-shadow: 6px 6px 0 var(--ui-text);
			}
			.overlay h1 {
				margin: 0;
				font-family: var(--ui-font);
				font-size: var(--fs-title);
				font-weight: 400;
				letter-spacing: 0.18em;
				color: var(--ui-blue);
			}
			.overlay .sub {
				margin: 8px 0 0;
				color: var(--ui-muted);
				text-transform: uppercase;
				font-size: var(--fs-sub);
			}
			.overlay .line {
				margin: 8px 0 0;
				color: var(--ui-text);
			}
			.overlay .actions {
				margin-top: 22px;
				display: flex;
				gap: 12px;
				justify-content: center;
			}
			/* Comic-sticker buttons: thick navy outline + a hard offset shadow,
			   no blur. Hover lifts toward the light; press slams into the shadow.
			   Label is flex-centered; ▶ cursor is out of flow so it can't shove
			   the text off optical vertical center. */
			/* Every clickable surface in the game is one sticker: cream fill, hard
			   ink outline, hard offset shadow, no blur. Variants below set only
			   what differs — radius, shadow depth, padding, font. Defining this
			   four times is how the splash buttons ended up with text sitting
			   2px low while the others were fine. */
			.sticker {
				--sticker-lift: 3px;
				--sticker-radius: 999px;
				--sticker-pad-x: 16px;
				--sticker-pad-y: 8px;
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-family: var(--ui-font);
				line-height: 1;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--ui-text);
				background: var(--ui-cream);
				border: 3px solid var(--ui-text);
				border-radius: var(--sticker-radius);
				/* Off-centre by 0.13em, measured not guessed: this display font's
				   caps ride low in a line-height:1 box, so even padding reads
				   bottom-heavy. Measured 2px of lift needed at 16px and 3px at
				   20px, hence em, so every variant corrects by the same ratio. */
				padding: calc(var(--sticker-pad-y) - 0.13em) var(--sticker-pad-x)
					calc(var(--sticker-pad-y) + 0.13em);
				cursor: pointer;
				box-shadow: var(--sticker-lift) var(--sticker-lift) 0 var(--ui-text);
				transition:
					transform 0.07s ease,
					box-shadow 0.07s ease,
					background 0.12s,
					color 0.12s;
			}
			.sticker:hover {
				background: var(--ui-button-hover);
				transform: translate(-1px, -1px);
				box-shadow: calc(var(--sticker-lift) + 2px) calc(var(--sticker-lift) + 2px) 0 var(--ui-text);
			}
			.sticker:active {
				transform: translate(var(--sticker-lift), var(--sticker-lift));
				box-shadow: 0 0 0 var(--ui-text);
			}
			.overlay button {
				--sticker-lift: 4px;
				--sticker-pad-x: 32px;
				--sticker-pad-y: 12px;
				font-size: var(--fs-button);
			}
			.overlay .actions button .label {
				display: block;
				line-height: 1;
				/* Clear of the ▶ cursor. Applied to every button, selected or not, so
				   moving the selection never nudges the text. */
				margin-left: 0.2rem;
			}
			/* The keyboard cursor: one action is always selected — a blinking ▶
			   marker plus a gold fill. Arrow keys / WASD move it, Enter/Space pick. */
			.overlay .actions button .cursor {
				position: absolute;
				left: 14px;
				top: 50%;
				transform: translateY(-50%);
				visibility: hidden;
				line-height: 1;
				pointer-events: none;
			}
			.overlay .actions button.selected {
				background: var(--ui-button);
			}
			.overlay .actions button.selected:hover {
				background: var(--ui-button-hover);
			}
			.overlay .actions button.selected .cursor {
				visibility: visible;
				animation: cursor-blink 1.1s step-end infinite;
			}
			@keyframes cursor-blink {
				0%,
				49% {
					opacity: 1;
				}
				50%,
				100% {
					opacity: 0;
				}
			}

			/* Weapon picker — bottom-center, visible during play. */
			.weapons {
				position: fixed;
				bottom: 12px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				font: var(--fs-base)/1.3 var(--ui-font);
				pointer-events: auto;
			}
			.weapons[hidden] {
				display: none;
			}
			.weapons .armed {
				font-size: 0.78em;
				line-height: 1;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--ui-text);
				-webkit-text-stroke: 4px #fffdf4;
				paint-order: stroke fill;
			}
			.weapons .armed.picked-up {
				color: #fffdf4;
				-webkit-text-stroke-color: var(--ui-text);
				animation: pickup-pop 0.35s ease-out;
			}
			@keyframes pickup-pop {
				from {
					transform: scale(1.2);
				}
				to {
					transform: scale(1);
				}
			}
			.controls {
				font:
					12px/1.4 system-ui,
					sans-serif;
				color: var(--ui-text);
			}
			.weapons .armed.off {
				color: var(--ui-muted);
			}
			.weapons .slots {
				display: flex;
				gap: 6px;
			}
			.weapons .slot {
				--sticker-radius: 16px;
				--sticker-pad-x: 12px;
				--sticker-pad-y: 10px;
				flex-direction: column;
				gap: 6px;
				min-width: 84px;
				font-size: var(--fs-slot);
			}
			.weapons .slot.active {
				background: color-mix(in srgb, var(--accent) 42%, var(--ui-cream));
				box-shadow:
					var(--sticker-lift) var(--sticker-lift) 0 var(--ui-text),
					0 0 16px color-mix(in srgb, var(--accent) 55%, transparent);
			}
			.weapons .slot .key {
				display: grid;
				place-items: center;
				width: 26px;
				height: 26px;
				border-radius: 8px;
				font-size: var(--fs-key);
				font-weight: 700;
				color: var(--ui-text);
				background: var(--accent);
				border: 2px solid var(--ui-text);
				box-shadow: 2px 2px 0 var(--ui-text);
			}
			.weapons .slot .name {
				font-size: var(--fs-name);
				letter-spacing: 0.04em;
				text-transform: uppercase;
				white-space: nowrap;
			}
			.weapons .charge {
				/* Fixed, not content-sized: the label text changes every few frames
				   and the panel must not resize under it. */
				width: 288px;
				box-sizing: border-box;
				padding: 9px 12px 11px;
				background: #fffdf4;
				border: 3px solid var(--ui-text);
				border-radius: 16px;
				box-shadow: 3px 3px 0 var(--ui-text);
			}
			.weapons .charge-track {
				position: relative;
				height: 12px;
				box-sizing: border-box;
				border: 2px solid var(--ui-text);
				border-radius: 6px;
				background: #fff2b8;
				overflow: hidden;
			}
			.weapons .charge-perfect {
				position: absolute;
				top: 0;
				bottom: 0;
				background: rgba(255, 93, 255, 0.22);
				border-left: 1px solid rgba(255, 93, 255, 0.55);
				border-right: 1px solid rgba(255, 93, 255, 0.55);
				pointer-events: none;
			}
			.weapons .charge-fill {
				position: absolute;
				top: 0;
				left: 0;
				bottom: 0;
				width: 0;
				border-radius: 4px;
				background: #ffd35d;
				transition: width 0.05s linear;
			}
			.weapons .charge-fill.perfect {
				background: #ff5dff;
			}
			.weapons .charge-label {
				margin-top: 7px;
				font-size: var(--fs-charge);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--ui-text);
				text-align: center;
				/* One line, always — a wrap would resize the panel vertically. */
				white-space: nowrap;
				overflow: hidden;
			}

			/* Mute toggle — bottom-right, always reachable (above the overlay). */
			.mute {
				position: fixed;
				bottom: 12px;
				right: 12px;
				z-index: 20;
				--sticker-radius: 50%;
				width: 48px;
				height: 48px;
				padding: 0; /* fixed square: the optical text correction would skew it */
				font-size: 22px;
			}
			.mute.muted {
				background: color-mix(in srgb, var(--ui-red) 30%, #fffdf4);
			}

			/* Splash title — big candy letters over the hub. The hub stays playable
			   underneath (pointer-events: none); this is pure signage. Letters pop in
			   staggered with an overshoot, then settle into a slow wave. Each letter
			   carries --i (stagger index) and --r (its resting tilt) so the keyframes
			   can preserve the tilt while animating transform. */
			.splash {
				position: fixed;
				top: 5vh;
				left: 0;
				right: 0;
				z-index: 5;
				display: grid;
				justify-items: center;
				gap: 18px;
				text-align: center;
				pointer-events: none;
			}
			.splash[hidden] {
				display: none;
			}
			.splash-title {
				margin: 0;
				font-family: var(--ui-font);
				font-weight: 400;
				font-size: clamp(56px, 11vw, 112px);
				line-height: 1;
				letter-spacing: 0.02em;
			}
			.splash-title .gap {
				display: inline-block;
				width: 0.3em;
			}
			/* Pop and wave live on nested spans so their transforms COMPOSE: the
			   letter is already waving while it pops in — one continuous motion,
			   no still-frame handoff between the two animations. */
			.splash-title .letter {
				display: inline-block;
				color: var(--l, var(--ui-gold));
				-webkit-text-stroke: 8px var(--ui-text);
				paint-order: stroke fill;
				text-shadow: 0.04em 0.06em 0 rgba(38, 68, 95, 0.25);
				animation: splash-pop 0.55s cubic-bezier(0.2, 1.9, 0.4, 1) calc(var(--i) * 0.055s) backwards;
			}
			.splash-title .letter .wob {
				display: inline-block;
				animation: splash-wave 2.6s ease-in-out calc(var(--i) * 0.13s) infinite;
			}
			/* Two-tone gold logo with alternating tilts. */
			.splash-title .letter:nth-child(odd) {
				--l: var(--ui-gold);
				--r: -4deg;
			}
			.splash-title .letter:nth-child(even) {
				--l: var(--ui-button);
				--r: 4deg;
			}
			@keyframes splash-pop {
				from {
					transform: translateY(-0.6em) scale(0.2) rotate(var(--r, 0deg));
					opacity: 0;
				}
				to {
					transform: translateY(0) scale(1) rotate(var(--r, 0deg));
					opacity: 1;
				}
			}
			@keyframes splash-wave {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-0.09em);
				}
			}
			/* Hint caption — plain ink text (no box: boxes read as buttons, and this
			   isn't clickable). A cream stroke lifts it off the sky. */
			.splash-hint {
				margin: 0;
				font: var(--fs-base) / 1 var(--ui-font);
				text-transform: uppercase;
				letter-spacing: 0.14em;
				color: var(--ui-text);
				-webkit-text-stroke: 6px #fffdf4;
				paint-order: stroke fill;
				animation: hint-hop 2.2s ease-in-out 1s infinite;
			}
			.splash-hint .arrow {
				color: var(--ui-gold);
				margin: 0 8px;
			}
			.portal-options {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 10px;
				pointer-events: auto;
			}
			.portal-option {
				font-size: 16px;
			}
			.portal-option:focus-visible {
				outline: 3px solid var(--ui-cream);
				outline-offset: 2px;
			}
			@keyframes hint-hop {
				0%,
				40%,
				100% {
					transform: translateY(0) scale(1, 1);
				}
				48% {
					transform: translateY(-7px) scale(0.97, 1.04);
				}
				56% {
					transform: translateY(0) scale(1.05, 0.94);
				}
				64% {
					transform: translateY(-2px) scale(1, 1);
				}
			}

			/* Teleport fade — a full-screen black flash that hides the hub→match swap. */
			.fade {
				position: fixed;
				inset: 0;
				z-index: 30;
				background: var(--ui-text);
				color: var(--cream, #fffdf4);
				display: grid;
				place-items: center;
				font-size: clamp(2rem, 6vw, 5rem);
				font-weight: 900;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.18s ease;
			}
			.fade.active {
				opacity: 1;
				pointer-events: auto;
			}
			.portal-option.recent {
				outline: 3px solid var(--accent-bow);
				outline-offset: 4px;
			}
			@media (prefers-reduced-motion: reduce) {
				.fade {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas class="app"></canvas>
		<div class="hud"></div>
		<div class="combat"></div>
		<div class="score" hidden></div>
		<div class="hit-confirmation" role="status" hidden></div>
		<div class="weapons" hidden></div>
		<button
			class="mute sticker"
			type="button"
			title="Mute"
			aria-label="Mute sound"
			aria-pressed="false"
		>
			🔊
		</button>
		<div class="overlay" hidden></div>
		<div class="splash" hidden>
			<h1 class="splash-title" aria-label="dodge this">
				<span class="letter" style="--i: 0"><span class="wob">D</span></span
				><span class="letter" style="--i: 1"><span class="wob">O</span></span
				><span class="letter" style="--i: 2"><span class="wob">D</span></span
				><span class="letter" style="--i: 3"><span class="wob">G</span></span
				><span class="letter" style="--i: 4"><span class="wob">E</span></span
				><span class="gap"></span
				><span class="letter" style="--i: 5"><span class="wob">T</span></span
