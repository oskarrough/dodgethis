<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barriecito&family=Darumadrop+One&family=Ranchers&display=swap"
			rel="stylesheet"
		/>
		<title>dodgethis</title>
		<style>
			:root {
				color-scheme: light;
				--ui-font: 'Darumadrop One', 'Ranchers', 'Barriecito', system-ui, sans-serif;
				--page-bg: #8fd7ff;
				--court-bg: #69d66f;
				--court-line: #fff7c7;
				--ui-text: #26445f;
				--ui-muted: #5f7897;
				--ui-panel: rgba(255, 249, 213, 0.9);
				--ui-panel-border: #ffbf3f;
				--ui-button: #ffcf5a;
				--ui-button-hover: #ffe27a;
				--ui-blue: #1677ff;
				--ui-red: #ff4f6d;
				--ui-green: #1b9f5a;
				--ui-gold: #ff9f1c;

				/* Font sizes. Darumadrop reads small, so we run large — base 20px.
				   Everything points at the base for now; tune each token individually. */
				--fs-base: 20px;
				--fs-hud: var(--fs-base);
				--fs-combat: 16px;
				--fs-score: var(--fs-base);
				--fs-title: var(--fs-base);
				--fs-sub: var(--fs-base);
				--fs-button: var(--fs-base);
				--fs-slot: var(--fs-base);
				--fs-name: var(--fs-base);
				--fs-key: var(--fs-base);
				--fs-charge: var(--fs-base);
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: var(--page-bg);
				font-family: var(--ui-font);
				font-size: var(--fs-base);
			}
			/* lil-gui auto-places with a 15px right gap — flush it to the edge. */
			.lil-gui.autoPlace {
				right: 0;
			}
			.app {
				width: 100vw;
				height: 100vh;
				display: block;
				background: var(--page-bg);
			}
			/* Left-stack developer chrome — system face so it never reads as match UI. */
			.hud {
				position: fixed;
				top: 10px;
				left: 10px;
				z-index: 2;
				font:
					12px/1.35 system-ui,
					sans-serif;
				color: rgba(38, 68, 95, 0.55);
				pointer-events: none;
				white-space: pre;
				letter-spacing: 0;
				max-width: min(42ch, 36vw);
			}
			.combat {
				position: fixed;
				bottom: 12px;
				left: 12px;
				width: 360px;
				max-height: 38vh;
				overflow: hidden;
				font:
					var(--fs-combat)/1.5 system-ui,
					sans-serif;
				color: var(--ui-text);
				pointer-events: none;
				display: flex;
				flex-direction: column;
				gap: 1px;
			}
			.combat .row {
				opacity: 0.55;
			}
			.combat .row:last-child {
				opacity: 1;
				color: var(--ui-text);
			}
			.combat .hit {
				color: var(--ui-red);
			}
			.combat .win {
				color: var(--ui-gold);
				font-weight: bold;
			}
			.combat .pickup {
				color: var(--ui-green);
			}

			/* Match chrome — gym scoreboard. Pips imply best-of; no panel. */
			.score {
				position: fixed;
				top: 14px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 3;
				display: flex;
				gap: 22px;
				align-items: baseline;
				font: var(--fs-score)/1 var(--ui-font);
				color: var(--ui-text);
				letter-spacing: 0.14em;
				pointer-events: none;
				text-transform: uppercase;
			}
			.score[hidden] {
				display: none;
			}
			.score .a {
				color: var(--ui-blue);
			}
			.score .b {
				color: var(--ui-red);
			}
			.score .pips {
				display: inline-flex;
				gap: 0.22em;
				align-items: center;
				margin: 0 0.15em;
				letter-spacing: 0;
			}
			.score .pip {
				display: inline-block;
				width: 0.55em;
				height: 0.55em;
				border: 2.5px solid currentColor;
				border-radius: 50%;
				box-sizing: border-box;
				vertical-align: middle;
			}
			.score .pip.on {
				background: currentColor;
			}
			.score .mid {
				color: var(--ui-text);
				letter-spacing: 0.08em;
				font-size: 0.72em;
				opacity: 0.72;
			}

			/* Modal overlay for round-over / match-over.
			   Round-over (.clear) keeps the court + scoreboard readable — no frost. */
			.overlay {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: grid;
				place-items: center;
				background: rgba(143, 215, 255, 0.42);
				backdrop-filter: blur(2px);
			}
			.overlay.clear {
				background: transparent;
				backdrop-filter: none;
			}
			.overlay[hidden] {
				display: none;
			}
			.overlay .card {
				text-align: center;
				color: var(--ui-text);
				font: var(--fs-base)/1.6 var(--ui-font);
				max-width: 60ch;
				padding: 28px 44px;
				background: var(--ui-panel);
				border: 3px solid var(--ui-text);
				border-radius: 24px;
				box-shadow: 6px 6px 0 var(--ui-text);
			}
			.overlay h1 {
				margin: 0;
				font-family: var(--ui-font);
				font-size: var(--fs-title);
				font-weight: 400;
				letter-spacing: 0.18em;
				color: var(--ui-blue);
			}
			.overlay .sub {
				margin: 8px 0 0;
				color: var(--ui-muted);
				text-transform: uppercase;
				font-size: var(--fs-sub);
			}
			.overlay .line {
				margin: 8px 0 0;
				color: var(--ui-text);
			}
			.overlay .actions {
				margin-top: 22px;
				display: flex;
				gap: 12px;
				justify-content: center;
			}
			/* Comic-sticker buttons: thick navy outline + a hard offset shadow,
			   no blur. Hover lifts toward the light; press slams into the shadow.
			   Label is flex-centered; ▶ cursor is out of flow so it can't shove
			   the text off optical vertical center. */
			.overlay button {
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-family: var(--ui-font);
				font-size: var(--fs-button);
				line-height: 1;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--ui-text);
				background: #fffdf4;
				border: 3px solid var(--ui-text);
				border-radius: 999px;
				padding: 12px 32px;
				cursor: pointer;
				box-shadow: 4px 4px 0 var(--ui-text);
				transition:
					transform 0.07s ease,
					box-shadow 0.07s ease,
					background 0.12s;
			}
			.overlay button:hover {
				background: var(--ui-button-hover);
				transform: translate(-1px, -1px);
				box-shadow: 6px 6px 0 var(--ui-text);
			}
			.overlay button:active {
				transform: translate(4px, 4px);
				box-shadow: 0 0 0 var(--ui-text);
			}
			.overlay .actions button .label {
				display: block;
				line-height: 1;
			}
			/* The keyboard cursor: one action is always selected — a blinking ▶
			   marker plus a gold fill. Arrow keys / WASD move it, Enter/Space pick. */
			.overlay .actions button .cursor {
				position: absolute;
				left: 14px;
				top: 50%;
				transform: translateY(-50%);
				visibility: hidden;
				line-height: 1;
				pointer-events: none;
			}
			.overlay .actions button.selected {
				background: var(--ui-button);
			}
			.overlay .actions button.selected:hover {
				background: var(--ui-button-hover);
			}
			.overlay .actions button.selected .cursor {
				visibility: visible;
				animation: cursor-blink 1.1s step-end infinite;
			}
			@keyframes cursor-blink {
				0%,
				49% {
					opacity: 1;
				}
				50%,
				100% {
					opacity: 0;
				}
			}

			/* Weapon picker — bottom-center, visible during play. */
			.weapons {
				position: fixed;
				bottom: 12px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				font: var(--fs-base)/1.3 var(--ui-font);
				pointer-events: auto;
			}
			.weapons[hidden] {
				display: none;
			}
			.weapons .armed {
				font-size: 0.78em;
				line-height: 1;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--ui-text);
				-webkit-text-stroke: 4px #fffdf4;
				paint-order: stroke fill;
			}
			.weapons .armed.off {
				color: var(--ui-muted);
			}
			.weapons .slots {
				display: flex;
				gap: 6px;
			}
			.weapons .slot {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				min-width: 84px;
				padding: 10px 12px;
				font: var(--fs-slot)/1.2 var(--ui-font);
				color: var(--ui-text);
				background: #fffdf4;
				border: 3px solid var(--ui-text);
				border-radius: 16px;
				cursor: pointer;
				box-shadow: 3px 3px 0 var(--ui-text);
				transition:
					transform 0.07s ease,
					box-shadow 0.07s ease,
					background 0.12s,
					color 0.12s;
			}
			.weapons .slot:hover {
				background: var(--ui-button-hover);
				transform: translate(-1px, -1px);
				box-shadow: 5px 5px 0 var(--ui-text);
			}
			.weapons .slot:active,
			.weapons .slot.active:active {
				transform: translate(3px, 3px);
				box-shadow: 0 0 0 var(--ui-text);
			}
			.weapons .slot.active {
				background: color-mix(in srgb, var(--accent) 42%, #fffdf4);
				box-shadow:
					3px 3px 0 var(--ui-text),
					0 0 16px color-mix(in srgb, var(--accent) 55%, transparent);
			}
			.weapons .slot .key {
				display: grid;
				place-items: center;
				width: 26px;
				height: 26px;
				border-radius: 8px;
				font-size: var(--fs-key);
				font-weight: 700;
				color: var(--ui-text);
				background: var(--accent);
				border: 2px solid var(--ui-text);
				box-shadow: 2px 2px 0 var(--ui-text);
			}
			.weapons .slot .name {
				font-size: var(--fs-name);
				letter-spacing: 0.04em;
				text-transform: uppercase;
				white-space: nowrap;
			}
			.weapons .charge {
				width: 100%;
				min-width: 228px;
				padding: 8px 10px;
				background: var(--ui-panel);
				border: 2px solid var(--ui-panel-border);
				border-radius: 8px;
			}
			.weapons .charge-track {
				position: relative;
				height: 8px;
				border-radius: 4px;
				background: #fff2b8;
				overflow: hidden;
			}
			.weapons .charge-perfect {
				position: absolute;
				top: 0;
				bottom: 0;
				background: rgba(255, 93, 255, 0.22);
				border-left: 1px solid rgba(255, 93, 255, 0.55);
				border-right: 1px solid rgba(255, 93, 255, 0.55);
				pointer-events: none;
			}
			.weapons .charge-fill {
				position: absolute;
				top: 0;
				left: 0;
				bottom: 0;
				width: 0;
				border-radius: 4px;
				background: #ffd35d;
				transition: width 0.05s linear;
			}
			.weapons .charge-fill.perfect {
				background: #ff5dff;
			}
			.weapons .charge-label {
				margin-top: 6px;
				font-size: var(--fs-charge);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--ui-muted);
				text-align: center;
			}

			/* Mute toggle — bottom-right, always reachable (above the overlay). */
			.mute {
				position: fixed;
				bottom: 12px;
				right: 12px;
				z-index: 20;
				width: 48px;
				height: 48px;
				display: grid;
				place-items: center;
				font-size: 22px;
				line-height: 1;
				color: var(--ui-text);
				background: #fffdf4;
				border: 3px solid var(--ui-text);
				border-radius: 50%;
				cursor: pointer;
				box-shadow: 3px 3px 0 var(--ui-text);
				transition:
					transform 0.07s ease,
					box-shadow 0.07s ease,
					background 0.12s;
			}
			.mute:hover {
				background: var(--ui-button-hover);
				transform: translate(-1px, -1px);
				box-shadow: 5px 5px 0 var(--ui-text);
			}
			.mute:active {
				transform: translate(3px, 3px);
				box-shadow: 0 0 0 var(--ui-text);
			}
			.mute.muted {
				background: color-mix(in srgb, var(--ui-red) 30%, #fffdf4);
			}

			/* Splash title — big candy letters over the hub. The hub stays playable
			   underneath (pointer-events: none); this is pure signage. Letters pop in
			   staggered with an overshoot, then settle into a slow wave. Each letter
			   carries --i (stagger index) and --r (its resting tilt) so the keyframes
			   can preserve the tilt while animating transform. */
			.splash {
				position: fixed;
				top: 5vh;
				left: 0;
				right: 0;
				z-index: 5;
				display: grid;
				justify-items: center;
				gap: 18px;
				text-align: center;
				pointer-events: none;
			}
			.splash[hidden] {
				display: none;
			}
			.splash-title {
				margin: 0;
				font-family: var(--ui-font);
				font-weight: 400;
				font-size: clamp(56px, 11vw, 112px);
				line-height: 1;
				letter-spacing: 0.02em;
			}
			.splash-title .gap {
				display: inline-block;
				width: 0.3em;
			}
			/* Pop and wave live on nested spans so their transforms COMPOSE: the
			   letter is already waving while it pops in — one continuous motion,
			   no still-frame handoff between the two animations. */
			.splash-title .letter {
				display: inline-block;
				color: var(--l, var(--ui-gold));
				-webkit-text-stroke: 8px var(--ui-text);
				paint-order: stroke fill;
				text-shadow: 0.04em 0.06em 0 rgba(38, 68, 95, 0.25);
				animation: splash-pop 0.55s cubic-bezier(0.2, 1.9, 0.4, 1) calc(var(--i) * 0.055s) backwards;
			}
			.splash-title .letter .wob {
				display: inline-block;
				animation: splash-wave 2.6s ease-in-out calc(var(--i) * 0.13s) infinite;
			}
			/* Two-tone gold logo with alternating tilts. */
			.splash-title .letter:nth-child(odd) {
				--l: var(--ui-gold);
				--r: -4deg;
			}
			.splash-title .letter:nth-child(even) {
				--l: var(--ui-button);
				--r: 4deg;
			}
			@keyframes splash-pop {
				from {
					transform: translateY(-0.6em) scale(0.2) rotate(var(--r, 0deg));
					opacity: 0;
				}
				to {
					transform: translateY(0) scale(1) rotate(var(--r, 0deg));
					opacity: 1;
				}
			}
			@keyframes splash-wave {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-0.09em);
				}
			}
			/* Hint caption — plain ink text (no box: boxes read as buttons, and this
			   isn't clickable). A cream stroke lifts it off the sky. */
			.splash-hint {
				margin: 0;
				font: var(--fs-base) / 1 var(--ui-font);
				text-transform: uppercase;
				letter-spacing: 0.14em;
				color: var(--ui-text);
				-webkit-text-stroke: 6px #fffdf4;
				paint-order: stroke fill;
				animation: hint-hop 2.2s ease-in-out 1s infinite;
			}
			.splash-hint .arrow {
				color: var(--ui-gold);
				margin: 0 8px;
			}
			.portal-options {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 10px;
				pointer-events: auto;
			}
			.portal-option {
				font: 16px/1 var(--ui-font);
				text-transform: uppercase;
				color: var(--ui-text);
				background: #fffdf4;
				border: 3px solid var(--ui-text);
				border-radius: 999px;
				padding: 8px 16px;
				cursor: pointer;
				box-shadow: 3px 3px 0 var(--ui-text);
			}
			.portal-option:hover,
			.portal-option:focus-visible {
				background: var(--ui-button-hover);
				outline: 3px solid #fffdf4;
				outline-offset: 2px;
			}
			.portal-option:active {
				transform: translate(3px, 3px);
				box-shadow: none;
			}
			@keyframes hint-hop {
				0%,
				40%,
				100% {
					transform: translateY(0) scale(1, 1);
				}
				48% {
					transform: translateY(-7px) scale(0.97, 1.04);
				}
				56% {
					transform: translateY(0) scale(1.05, 0.94);
				}
				64% {
					transform: translateY(-2px) scale(1, 1);
				}
			}

			/* Teleport fade — a full-screen black flash that hides the hub→match swap. */
			.fade {
				position: fixed;
				inset: 0;
				z-index: 30;
				background: #0a0e14;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.28s ease;
			}

			@media (prefers-reduced-motion: reduce) {
				.overlay .actions button.selected .cursor,
				.splash-title .letter,
				.splash-title .letter .wob,
				.splash-hint {
					animation: none;
				}
				.fade {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas class="app"></canvas>
		<div class="hud"></div>
		<div class="combat"></div>
		<div class="score" hidden></div>
		<div class="weapons" hidden></div>
		<button class="mute" type="button" title="Mute" aria-label="Mute sound" aria-pressed="false">
			🔊
		</button>
		<div class="overlay" hidden></div>
		<div class="splash" hidden>
			<h1 class="splash-title" aria-label="dodge this">
				<span class="letter" style="--i: 0"><span class="wob">D</span></span
				><span class="letter" style="--i: 1"><span class="wob">O</span></span
				><span class="letter" style="--i: 2"><span class="wob">D</span></span
				><span class="letter" style="--i: 3"><span class="wob">G</span></span
				><span class="letter" style="--i: 4"><span class="wob">E</span></span
				><span class="gap"></span
				><span class="letter" style="--i: 5"><span class="wob">T</span></span
				><span class="letter" style="--i: 6"><span class="wob">H</span></span
				><span class="letter" style="--i: 7"><span class="wob">I</span></span
				><span class="letter" style="--i: 8"><span class="wob">S</span></span>
			</h1>
			<p class="splash-hint">
				<span class="arrow">▼</span>walk into a portal<span class="arrow">▼</span>
			</p>
			<div class="portal-options" role="group" aria-label="Choose difficulty">
				<button class="portal-option" type="button" data-enemies="1">Chill · 1 foe</button>
				<button class="portal-option" type="button" data-enemies="2">Spicy · 2 foes</button>
				<button class="portal-option" type="button" data-enemies="3">Chaos · 3 foes</button>
			</div>
		</div>
		<div class="fade"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
