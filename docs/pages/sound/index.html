<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sound board · dodgethis</title>
		<link rel="stylesheet" href="/docs/page.css" />
		<!-- The board's only own CSS: three Finder panes side by side, wider than a normal page. -->
		<style>
			.page:has(.board) {
				max-width: none;
			}
			.board {
				display: grid;
				grid-template-columns: 15rem minmax(0, 1fr) 24rem;
				gap: 1.5rem;
				align-items: start;
			}
			.board > * {
				max-height: 85vh;
				overflow: auto;
			}
		</style>
	</head>
	<body class="page">
		<header>
			<h1>Sound board</h1>
			<p>
				Pick a folder, then a sound. Swaps reach the game open in another tab of this browser on its
				next event; Keep puts a swap in the game for everyone.
				<button id="fight" type="button">Play a crowded fight</button>
				<button id="stop" type="button">Stop music</button>
			</p>
		</header>
		<main class="board">
			<nav id="folders" aria-label="Folders"></nav>
			<section id="list"></section>
			<aside id="details"></aside>
		</main>
		<script type="module" src="./board.js"></script>
	</body>
</html>
