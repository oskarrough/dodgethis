<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sound board · dodgethis</title>
		<link rel="stylesheet" href="/docs/page.css" />
		<!-- The board is a tool, so it styles itself: a desktop app filling the window. A bar on top, the strip
		     (every sound as a light, in the order a player meets them), then three panes: sources, the stage (the
		     sound map or a tool) and the inspector with the deck. -->
		<style>
			html,
			body {
				height: 100%;
			}
			.page.app {
				max-width: none;
				height: 100%;
				padding: 0;
				display: grid;
				grid-template-rows: auto auto minmax(0, 1fr);
				overflow: hidden;
				--line: #1d1a1722;
				--soft: #1d1a1799;
				--paper: #fbf6ea;
				--trying: #3a6ee0;
				--kept: #f2b632;
				--builtin: #c9bfa9;
			}
			.app h1,
			.app h2,
			.app h3 {
				margin: 0;
			}
			.app button {
				font: inherit;
				font-size: 14px;
				border: 1px solid var(--line);
				background: var(--paper);
				border-radius: 6px;
				padding: 3px 9px;
				cursor: pointer;
				color: inherit;
			}
			.app button:hover {
				background: #fff;
			}
			.app button[aria-pressed='true'] {
				background: var(--ink);
				color: var(--cream);
			}
			.app button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			.app kbd {
				font:
					700 12px/1.4 system-ui,
					sans-serif;
				border: 1px solid var(--line);
				border-bottom-width: 2px;
				border-radius: 4px;
				padding: 0 4px;
				margin-right: 5px;
				display: inline-block;
				min-width: 1.4em;
				text-align: center;
				background: #fff;
			}
			.app select,
			.app input[type='search'] {
				font: inherit;
				font-size: 14px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: #fff;
				padding: 3px 6px;
				max-width: 100%;
			}

			/* The bar: name, how far Oskar has got, global actions, tools. */
			.bar {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 14px;
				border-bottom: 1px solid var(--line);
				background: var(--paper);
			}
			.bar h1 {
				font-size: 17px;
				margin-right: 6px;
			}
			.bar .grow {
				flex: 1;
			}
			.progress {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 13px;
				color: var(--soft);
			}
			.progress meter {
				width: 140px;
				height: 10px;
			}
			.bar output {
				font-size: 13px;
				color: var(--soft);
			}

			/* The strip: one light per sound, grouped by source, in the order a player meets them. */
			.strip {
				display: flex;
				gap: 14px;
				padding: 8px 14px 10px;
				overflow-x: auto;
				border-bottom: 1px solid var(--line);
				scrollbar-width: thin;
			}
			.strip .source {
				display: grid;
				gap: 4px;
				flex: none;
			}
			.strip .source > span {
				font-size: 11px;
				color: var(--soft);
				white-space: nowrap;
			}
			.strip .group-start {
				padding-left: 14px;
				border-left: 1px solid var(--line);
			}
			.lights {
				display: flex;
				gap: 3px;
			}
			.app .light {
				all: unset;
				box-sizing: border-box;
				width: 13px;
				height: 13px;
				border-radius: 3px;
				cursor: pointer;
				background: var(--builtin);
			}
			.light[data-status='kept'] {
				background: var(--kept);
			}
			.light[data-status='trying'] {
				background: var(--trying);
			}
			.light[data-status='music'] {
				background: transparent;
				border: 1px dashed var(--soft);
			}
			.light[data-flag] {
				box-shadow: inset 0 -3px 0 var(--red);
			}
			.light[aria-current='true'] {
				outline: 2px solid var(--ink);
				outline-offset: 1px;
			}
			.light:hover {
				transform: scale(1.25);
			}

			/* Three panes. */
			.panes {
				display: grid;
				grid-template-columns: 15rem minmax(0, 1fr) 24rem;
				min-height: 0;
			}
			.panes > * {
				min-height: 0;
				overflow: auto;
			}
			.sources {
				border-right: 1px solid var(--line);
				padding: 10px 0;
				font-size: 14px;
			}
			.sources h2 {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--soft);
				padding: 10px 14px 4px;
			}
			.sources ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}
			.sources a {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 3px 14px;
				color: inherit;
				text-decoration: none;
			}
			.sources a:hover {
				background: #fff8;
			}
			.sources a[aria-current='true'] {
				background: var(--ink);
				color: var(--cream);
			}
			.sources .count {
				margin-left: auto;
				font-size: 12px;
				color: var(--soft);
			}
			.sources a[aria-current='true'] .count {
				color: inherit;
			}
			.sources ul ul a {
				padding-left: 30px;
				font-size: 13px;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				flex: none;
				background: var(--builtin);
			}
			.dot[data-status='kept'] {
				background: var(--kept);
			}
			.dot[data-status='trying'] {
				background: var(--trying);
			}
			.dot[data-status='music'] {
				background: transparent;
				border: 1px dashed currentColor;
			}

			.stage {
				display: grid;
				grid-template-rows: auto minmax(0, 1fr);
				overflow: hidden;
			}
			.tabs {
				display: flex;
				gap: 4px;
				padding: 8px 12px;
				border-bottom: 1px solid var(--line);
			}
			.tabs button {
				border-color: transparent;
				background: transparent;
			}
			#view {
				position: relative;
				min-height: 0;
				overflow: auto;
			}
			#map {
				position: absolute;
				inset: 0;
			}
			#map[hidden] {
				display: none;
			}
			.tool {
				padding: 14px 20px;
				max-width: 52rem;
			}

			.inspector {
				border-left: 1px solid var(--line);
				background: var(--paper);
				padding: 14px 16px 24px;
				display: grid;
				gap: 12px;
				align-content: start;
			}
			.inspector h2 {
				font:
					600 18px ui-monospace,
					monospace;
			}
			.inspector .about {
				margin: 2px 0 0;
				color: var(--soft);
			}
			.inspector h3 {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--soft);
				margin-bottom: 4px;
			}
			.inspector p {
				margin: 0;
			}
			.wave {
				display: block;
				width: 100%;
				height: 56px;
				border-radius: 6px;
				background: #fff;
				border: 1px solid var(--line);
			}
			.card {
				border: 1px solid var(--line);
				border-radius: 10px;
				background: #fff;
				padding: 12px;
				display: grid;
				gap: 8px;
				box-shadow: 0 2px 0 var(--line);
			}
			.card .wave {
				height: 72px;
				border: 0;
				background: var(--paper);
			}
			.card .name {
				font-weight: 700;
				overflow-wrap: anywhere;
			}
			.card .meta {
				font-size: 12px;
				color: var(--soft);
			}
			.card.swipe-left {
				animation: left 0.22s ease-in;
			}
			.card.swipe-right {
				animation: right 0.22s ease-in;
			}
			@keyframes left {
				to {
					transform: translateX(-30px) rotate(-3deg);
					opacity: 0.2;
				}
			}
			@keyframes right {
				to {
					transform: translateX(30px) rotate(3deg);
					opacity: 0.2;
				}
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				align-items: center;
			}
			.row .grow {
				flex: 1;
			}
			.keep {
				background: var(--kept) !important;
				font-weight: 700;
			}
			.facts {
				font-size: 13px;
				color: var(--soft);
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 2px 10px;
				margin: 0;
			}
			.facts dd {
				margin: 0;
				color: var(--ink);
				overflow-wrap: anywhere;
			}
			.shuffle {
				list-style: none;
				margin: 0;
				padding: 0;
				font-size: 13px;
				display: grid;
				gap: 4px;
			}
			.shuffle li {
				display: flex;
				gap: 6px;
				align-items: center;
			}
			.shuffle li span {
				flex: 1;
				overflow-wrap: anywhere;
			}
			.flag:empty {
				display: none;
			}
			.flag {
				color: var(--red);
				font-size: 13px;
			}
			/* The palette. */
			.palette {
				width: min(36rem, 90vw);
				margin-top: 12vh;
				padding: 0;
				border: 1px solid var(--line);
				border-radius: 12px;
				background: var(--paper);
				box-shadow: 0 20px 60px #1d1a1733;
			}
			.palette::backdrop {
				background: #1d1a1722;
			}
			.palette input {
				width: 100%;
				box-sizing: border-box;
				border: 0 !important;
				border-bottom: 1px solid var(--line) !important;
				border-radius: 0 !important;
				padding: 14px 16px !important;
				font-size: 17px !important;
				outline: none;
				background: transparent !important;
			}
			.palette ol {
				list-style: none;
				margin: 0;
				padding: 6px;
				max-height: 50vh;
				overflow: auto;
			}
			.palette ol:empty {
				display: none;
			}
			.palette li {
				display: flex;
				gap: 12px;
				align-items: baseline;
				padding: 6px 10px;
				border-radius: 6px;
				cursor: pointer;
			}
			.palette li small {
				margin-left: auto;
				color: var(--soft);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.palette li[aria-selected='true'] {
				background: var(--ink);
				color: var(--cream);
			}
			.palette li[aria-selected='true'] small {
				color: inherit;
			}
			.empty {
				color: var(--soft);
				padding: 40px 20px;
			}
		</style>
	</head>
	<body class="page app">
		<header class="bar">
			<h1>Sound board</h1>
			<div class="progress" id="progress"></div>
			<span class="grow"></span>
			<button
				id="fight"
				type="button"
				title="A seeded burst of fight sounds through the game's mix"
			>
				Crowded fight
			</button>
			<button id="stop" type="button">Stop music</button>
			<button
				id="resync"
				type="button"
				title="New sounds go in Dropbox under Rough Resources/Sounds/osk-sfx/ (any folder). Resync copies them in and rebuilds every shortlist."
			>
				Resync from Dropbox
			</button>
			<output id="resync-status"></output>
		</header>
		<nav class="strip" id="strip" aria-label="Every sound"></nav>
		<main class="panes">
			<nav class="sources" id="sources" aria-label="Sources"></nav>
			<section class="stage">
				<div class="tabs" id="tabs" role="tablist"></div>
				<div id="view">
					<div id="map"></div>
					<div id="tool" class="tool" hidden></div>
				</div>
			</section>
			<aside class="inspector" id="inspector"></aside>
		</main>
		<script type="module" src="./board.js"></script>
	</body>
</html>
