<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>For Oskar to decide · dodgethis</title>
		<link rel="stylesheet" href="/docs/page.css" />
		<style>
			#items li {
				display: flex;
				gap: 16px;
				align-items: flex-start;
				margin-bottom: 16px;
				list-style: none;
			}
			#items img {
				width: 96px;
				aspect-ratio: 16 / 10;
				flex: none;
			}
		</style>
	</head>
	<body class="page">
		<main>
			<h1>For Oskar to decide</h1>
			<p class="lede">
				Every item has a page. To review first, then Decided; the orchestrator records Oskar's
				answer on the item in <code>items.json</code>.
			</p>
			<ul id="items"></ul>
			<details>
				<summary>Archived</summary>
				<ul id="archived"></ul>
			</details>
			<script>
				const chip = { 'To review': 'gold', Decided: 'blue', Archived: '' }
				fetch('items.json')
					.then((r) => r.json())
					.then((items) => {
						const rank = { 'To review': 0, Decided: 1, Archived: 2 }
						items.sort((a, b) => rank[a.status] - rank[b.status] || b.at.localeCompare(a.at))
						for (const i of items) {
							const thumb = i.media.find((f) => !/\.(webm|mp4)$/i.test(f))
							document
								.getElementById(i.status === 'Archived' ? 'archived' : 'items')
								.insertAdjacentHTML(
									'beforeend',
									`<li>${thumb ? `<img src="${thumb}" alt="" loading="lazy">` : ''}<div>
<span class="chip ${chip[i.status]}">${i.status}</span> <a href="${i.page}"><b>${i.title}</b></a> <small>${i.at.slice(0, 10)}</small>
<p>${i.status === 'Decided' && i.decision ? i.decision : i.ask}</p></div></li>`,
								)
						}
					})
			</script>
		</main>
	</body>
</html>
